---
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Verify Home Assistant test environment
        run: |
          python -m pip check
          python -c 'from homeassistant.const import __version__; from importlib.metadata import version; assert __version__ == version("pytest-homeassistant") == "2026.11.0"'

      - name: Run tests with coverage
        run: >-
          pytest
          --cov=custom_components.solplanet
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
