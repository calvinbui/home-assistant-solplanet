replace_schedule_day:
  name: Replace Schedule Day
  description: Replace all slots for one day in one schedule write. Other days are read from the inverter immediately before the write.
  target:
    entity:
      integration: solplanet
      domain: binary_sensor
  fields:
    day:
      name: Day
      description: Day of the week to replace
      required: true
      selector:
        select:
          options:
            - "Mon"
            - "Tus"
            - "Wen"
            - "Thu"
            - "Fri"
            - "Sat"
            - "Sun"
    slots:
      name: Slots
      description: List of slots with start_hour, start_minute, duration, and mode fields. Use an empty list to clear the day.
      required: true
    pin:
      name: Schedule Input Power
      description: Optional charging power in watts (0-10000, in 100 W steps).
      required: false
      selector:
        number:
          min: 0
          max: 10000
          step: 100
          mode: box
    pout:
      name: Schedule Output Power
      description: Optional discharging power in watts (0-10000, in 100 W steps).
      required: false
      selector:
        number:
          min: 0
          max: 10000
          step: 100
          mode: box

set_schedule_slots:
  name: Set Schedule Slots
  description: Set a charging/discharging schedule slot for a specific battery
  target:
    entity:
      integration: solplanet
      domain: binary_sensor
  fields:
    day:
      name: Day
      description: Day of the week
      required: true
      selector:
        select:
          options:
            - "Mon"
            - "Tus"
            - "Wen"
            - "Thu"
            - "Fri"
            - "Sat"
            - "Sun"
    start_hour:
      name: Start Hour
      description: Hour to start (0-23)
      required: true
      selector:
        number:
          min: 0
          max: 23
          step: 1
          mode: box
    start_minute:
      name: Start Minute
      description: Minute to start (0 or 30)
      required: true
      selector:
        number:
          min: 0
          max: 30
          step: 30
          mode: box
    duration:
      name: Duration
      description: Duration in hours (1-4)
      required: true
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: box
    mode:
      name: Mode
      description: Charge or discharge mode
      required: true
      selector:
        select:
          options:
            - "charge"
            - "discharge"

clear_schedule:
  name: Clear Schedule
  description: Clear schedule for specific battery
  target:
    entity:
      integration: solplanet
      domain: binary_sensor
  fields:
    day:
      name: Day
      description: Day to clear or 'all' for all days
      required: true
      selector:
        select:
          options:
            - "all"
            - "Mon"
            - "Tus"
            - "Wen"
            - "Thu"
            - "Fri"
            - "Sat"
            - "Sun"

set_meter_limit_power:
  name: Enable power limit control (Limit power)
  description: Enable power limit control in Limit power mode.
  fields:
    device_id:
      name: Meter device
      description: Select the Solplanet meter device.
      required: true
      selector:
        device:
          integration: solplanet
    abs:
      name: Limit mode
      required: true
      selector:
        select:
          options:
            - label: "Phase-balanced (Sum of all phases)"
              value: "0"
            - label: "Phase-specific (Per phase)"
              value: "1"
    limitType:
      name: Limit type
      required: true
      selector:
        select:
          options:
            - label: "(W) absolute power"
              value: "0"
            - label: "(%) of nominal system power"
              value: "1"
    target:
      name: Export power limit setpoint (W)
      description: Required when Limit type is Absolute. 0 to inverter rated power.
      required: false
      selector:
        number:
          min: 0
          max: 50000
          step: 1
          mode: box
    targetPer:
      name: Export power limit setpoint (%)
      description: Required when Limit type is Percent. 0 to 100.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    powerDiff:
      name: Setpoint offset (W)
      description: -1000 to 1000
      required: true
      selector:
        number:
          min: -1000
          max: 1000
          step: 1
          mode: box
    lostTime:
      name: Communications loss timeout (seconds)
      description: 1 to 60
      required: true
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box
    lostPowerMax:
      name: Communications loss power limit (W)
      description: 0 to inverter rated power
      required: true
      selector:
        number:
          min: 0
          max: 50000
          step: 1
          mode: box

set_meter_limit_current:
  name: Enable power limit control (Limit current)
  description: Enable power limit control in Limit current mode.
  fields:
    device_id:
      name: Meter device
      description: Select the Solplanet meter device.
      required: true
      selector:
        device:
          integration: solplanet
    maxOutCurr:
      name: Maximum export current limit (A)
      description: 0 to 3000
      required: true
      selector:
        number:
          min: 0
          max: 3000
          step: 1
          mode: box
    maxInCurr:
      name: Maximum import current limit (A)
      description: 0 to 3000
      required: true
      selector:
        number:
          min: 0
          max: 3000
          step: 1
          mode: box
    currDiff:
      name: Setpoint offset (A)
      description: -10 to 10
      required: true
      selector:
        number:
          min: -10
          max: 10
          step: 1
          mode: box
    lostTime:
      name: Communications loss timeout (s)
      description: 1 to 60
      required: true
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box
    lostCurrMax:
      name: Communications loss current limit (A)
      description: 0 to Maximum export current limit.
      required: true
      selector:
        number:
          min: 0
          max: 3000
          step: 1
          mode: box

set_meter_zero_power:
  name: Enable power limit control (Zero power)
  description: Enable power limit control in Zero power mode.
  fields:
    device_id:
      name: Meter device
      description: Select the Solplanet meter device.
      required: true
      selector:
        device:
          integration: solplanet
    lostTime:
      name: Communications loss timeout (s)
      description: 1 to 60
      required: true
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box

set_compatibility_meter_power_limit:
  name: Configure power limit control (404 compatibility)
  description: This is a separate Home Assistant action for firmware with the simpler E-meter power limit page. Use it only when the standard Limit power action returns HTTP 404.
  fields:
    device_id:
      name: Meter device
      description: Select the main Solplanet meter device.
      required: true
      selector:
        device:
          integration: solplanet
    enabled:
      name: Enable power limit control
      description: Enable or disable export power limit control.
      required: true
      selector:
        boolean:
    target_percentage:
      name: Export power limit setpoint (%)
      description: Percentage of nominal system power. The supported range observed on compatible firmware is -1% to 10%.
      required: true
      selector:
        number:
          min: -1
          max: 10
          step: 0.01
          mode: box
    fail_safe:
      name: Fail safe
      description: Enable the firmware's communication-interruption fail-safe setting.
      required: true
      selector:
        boolean:

disable_meter_power_limit:
  name: Disable power limit control
  description: Disable power limit control.
  fields:
    device_id:
      name: Meter device
      description: Select the Solplanet meter device.
      required: true
      selector:
        device:
          integration: solplanet

modbus_write_single_holding_register:
  name: Modbus write single holding register
  description: Write a single holding register to a modbus device.
  fields:
    device_address:
      name: Device address
      description: The modbus device address.
      required: true
      selector:
        number:
          min: 1
          max: 255
          step: 1
          mode: box
    register_address:
      name: Register address
      description: The modbus register address to write to (full address, not offset).
      required: true
      selector:
        number:
          min: 1
          max: 65535
          step: 1
          mode: box
    data_type:
      name: Data type
      description: The type of data to write.
      required: true
      selector:
        select:
          options:
            - label: "B16 - Bit field 16-bit"
              value: "B16"
            - label: "B32 - Bit field 32-bit"
              value: "B32"
            - label: "S16 - Signed 16-bit Integer"
              value: "S16"
            - label: "U16 - Unsigned 16-bit Integer"
              value: "U16"
            - label: "S32 - Signed 32-bit Integer"
              value: "S32"
            - label: "U32 - Unsigned 32-bit Integer"
              value: "U32"
            - label: "E16 - Number code 16-bit"
              value: "E16"
    value:
      name: Data value
      description: The value to write to the register.
      required: true
      selector:
        number:
          step: 1
          mode: box
    dry_run:
      name: Dry run
      description: If true, rtu frame will be generated and logged but not sent.
      required: true
      default: false
      selector:
        boolean: {}
